name: gitleaks

# push only on main: an unscoped push trigger fired a duplicate run on every
# PR, and the pull_request run already scans the branch's whole commit range
# (baseRef^..headRef), so scoping it loses no pre-merge coverage.
#
# Scanning branch pushes here would not prevent a leak in any case: the job
# starts after GitHub has accepted the objects, and on a public repo that
# acceptance is the exposure. Push protection is what rejects a secret at
# push time. This workflow is the gate on what reaches main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # full history so PR scans cover the entire diff range, not just the tip commit
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
